name: Exarch engine release

# Builds the `t3` server package from this branch and publishes it as a GitHub
# release. Exarch's packaging installs the release package by URL with lockfile
# integrity. The resource monitor is compiled here from native/resource-monitor
# for every platform Exarch ships, so a release needs no other package.
# exarch/pack.mjs owns that platform list and checks every asset; the helpers
# matrix below must name the same platforms, or packing fails.

on:
  # Native release builds incur paid runner work and require explicit dispatch.
  # Publishing an already verified local artifact must not rebuild that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.0.42-exarch.2005"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: exarch-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  helpers:
    name: Resource monitor (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            binary: t3-resource-monitor
          - key: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            binary: t3-resource-monitor
          - key: darwin-x64
            runner: macos-15
            rust_target: x86_64-apple-darwin
            binary: t3-resource-monitor
          - key: win32-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            binary: t3-resource-monitor.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: |
            native/resource-monitor
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.rust_target }} --manifest-path native/resource-monitor/Cargo.toml

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.key }}
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and release
    needs: [helpers]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Resolve release inputs
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-exarch\.([0-9]+)$ ]]; then
            echo "Tag must look like v0.0.41-exarch.1, got: $tag" >&2
            exit 1
          fi
          source_commit="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [[ "$source_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Selected tag $tag does not match the checked-out source" >&2
            exit 1
          fi
          version="${tag#v}"
          base_branch="$(node -p "require('./exarch/base.json').upstreamBranch")"
          base_commit="$(node -p "require('./exarch/base.json').upstreamCommit")"
          base_version="$(node -p "require('./exarch/base.json').sourceVersion")"
          if [[ "$base_version" != "${BASH_REMATCH[1]}" ]]; then
            echo "exarch/base.json names $base_version; the tag says ${BASH_REMATCH[1]}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base_commit" HEAD; then
            echo "exarch/base.json names $base_commit, which is not an ancestor of HEAD" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "base_branch=$base_branch"
            echo "base_commit=$base_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version from $base_branch ($base_commit) at $source_commit"

      # Exarch's own relay, Clerk instance and hosted-app origin. Public values only.
      - name: Use the public Exarch Connect identifiers
        run: cp exarch/public-config.env .env

      - name: Align package versions to the release version
        run: node scripts/update-release-package-versions.ts "${{ steps.meta.outputs.version }}"

      # The t3 build task depends on @t3tools/web#build, so the web client is
      # built and bundled into dist/client as part of this step.
      - name: Build the server package
        run: vp run --filter t3 build

      - name: Download the resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: resource-monitor-*
          path: ${{ runner.temp }}/resource-monitor

      # Installs the monitors built by this run, checks every asset and the
      # stamped version, and packs from a temporary copy.
      - name: Pack
        id: pack
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          result="$(node exarch/pack.mjs --version "$VERSION" --out "$out" --helpers "$RUNNER_TEMP/resource-monitor")"
          echo "$result"
          {
            echo "file=$(node -pe 'JSON.parse(process.argv[1]).file' "$result")"
            echo "sha256=$(node -pe 'JSON.parse(process.argv[1]).sha256' "$result")"
            echo "platforms=$(node -pe 'JSON.stringify(JSON.parse(process.argv[1]).platforms)' "$result")"
            echo "dir=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Write the provenance record
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.source_commit }}
          BASE_BRANCH: ${{ steps.meta.outputs.base_branch }}
          BASE_COMMIT: ${{ steps.meta.outputs.base_commit }}
          FILE: ${{ steps.pack.outputs.file }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
          PLATFORMS: ${{ steps.pack.outputs.platforms }}
          OUT: ${{ steps.pack.outputs.dir }}
        run: |
          set -euo pipefail
          git log --format='%H%x09%s' "$BASE_COMMIT..$SOURCE_COMMIT" > "$OUT/commits.tsv"
          node -e '
            const fs = require("node:fs");
            const env = process.env;
            const base = require("./exarch/base.json");
            const platforms = JSON.parse(env.PLATFORMS);
            const commits = fs.readFileSync(`${env.OUT}/commits.tsv`, "utf8").split("\n").filter(Boolean).map((line) => {
              const [commit, ...subject] = line.split("\t");
              return { commit, subject: subject.join("\t") };
            });
            const record = {
              package: "t3",
              version: env.VERSION,
              tag: env.TAG,
              forkRepository: `https://github.com/${env.GITHUB_REPOSITORY}`,
              forkCommit: env.SOURCE_COMMIT,
              upstreamRepository: base.upstreamRepository,
              upstreamBranch: env.BASE_BRANCH,
              upstreamCommit: env.BASE_COMMIT,
              helperBinaries: { path: "dist/resource-monitor", targets: platforms, source: "compiled by this workflow run from native/resource-monitor at the release commit" },
              exarchCommits: commits,
              tarball: { name: require("node:path").basename(env.FILE), sha256: env.SHA256 },
              workflowRun: `https://github.com/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
              builtAt: new Date().toISOString(),
              license: "MIT",
            };
            fs.writeFileSync(`${env.OUT}/provenance.json`, JSON.stringify(record, null, 2) + "\n");
            const notes = [
              `Exarch engine ${env.VERSION}`,
              "",
              `Source: ${env.TAG} (${env.SOURCE_COMMIT}).`,
              "",
              `Built from upstream ${env.BASE_BRANCH} (${env.BASE_COMMIT}) plus ${commits.length} Exarch commit(s). The resource monitor is compiled by this run for ${platforms.join(", ")}.`,
              "",
              `Package SHA-256: ${env.SHA256}`,
              "",
              "Assets: the package file, its checksum, and provenance.json. A build attestation is attached to the package file.",
            ].join("\n");
            fs.writeFileSync(`${env.OUT}/notes.md`, notes + "\n");
          '
          cat "$OUT/provenance.json"

      - name: Attest the package file
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
          OUT: ${{ steps.pack.outputs.dir }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Exarch engine $VERSION" \
            --notes-file "$OUT/notes.md" \
            --verify-tag \
            "$FILE" "$FILE.sha256" "$OUT/provenance.json"
